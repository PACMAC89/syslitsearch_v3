[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "syslitsearch"
version = "0.1.0"
description = "Search strings across literature databases, a lexical title/abstract filter, screening and data extraction for systematic literature reviews"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "openpyxl>=3.1", "python-dotenv>=1.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["syslitsearch*"]
